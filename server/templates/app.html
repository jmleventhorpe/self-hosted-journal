<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css">
</head>
<body>
  <div class="app view-editor" id="app-root">
    <div class="mobile-toolbar">
      <button id="mobile-tab-calendar" class="mobile-tab" title="Calendar">Calendar</button>
      <button id="mobile-tab-editor" class="mobile-tab active" title="Entry">Entry</button>
    </div>
    <div class="calendar-panel">
      <div class="calendar-nav">
        <button id="prev-month" class="nav-btn" title="Previous month" aria-label="Previous month">◀</button>
        <select id="month-select" aria-label="Month"></select>
        <select id="year-select" aria-label="Year"></select>
        <span class="spacer"></span>
        <button id="today-btn" class="nav-btn today-btn" title="Go to today">Today</button>
        <button id="next-month" class="nav-btn" title="Next month" aria-label="Next month">▶</button>
      </div>
      <div class="special-page-row">
        <button id="template-btn" class="template-toggle-btn" title="Edit the reusable template">Template</button>
        <button id="info-btn" class="template-toggle-btn" title="Quick-access notes and research">Info</button>
      </div>
      <div id="calendar-grid" class="calendar-grid" role="group" aria-label="Calendar - arrow keys move between days"></div>
      <button id="logout-btn" class="logout-btn">Log out</button>
    </div>

    <div class="editor-panel">
      <div class="date-row">
        <div class="date-title">
          <button id="prev-day" class="nav-btn" title="Previous day (Alt+PageUp)" aria-label="Previous day">‹</button>
          <h1 id="date-label" aria-live="polite"></h1>
          <button id="next-day" class="nav-btn" title="Next day (Alt+PageDown)" aria-label="Next day">›</button>
        </div>
        <button id="import-template-btn" class="accent-btn">Import Template</button>
      </div>
      <div id="editor"></div>
      <div class="status-bar">
        <span id="status" role="status"></span>
        <span id="word-count" class="word-count"></span>
      </div>
    </div>
  </div>

  <div id="unlock-overlay" class="unlock-overlay" hidden>
    <form id="unlock-form" class="login-card">
      <h1>Session expired</h1>
      <p class="hint">Unlock again to keep saving. Anything you haven't saved yet is still on this page.</p>
      <input type="password" id="unlock-password" placeholder="Password" autocomplete="current-password">
      <p id="unlock-error" class="error"></p>
      <button type="submit">Unlock</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
